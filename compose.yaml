# Local Postgres with pgvector and the v0 API.
#   make db-up / make db-down; make up starts both (the app on http://127.0.0.1:8000).
services:
  app:
    build: .
    ports: ["127.0.0.1:8000:8080"]   # localhost only (spec R15); no auth in v0
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg18   # same major version as Aurora (AgentCore spec R10a)
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app   # local only
      POSTGRES_DB: app
    ports: ["5432:5432"]
    # PostgreSQL 18 images keep data under /var/lib/postgresql/18/; the pg17 volume `pgdata` is no longer used.
    volumes: [pgdata18:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10

volumes:
  pgdata18:
