# Weekly update pull requests, grouped so each ecosystem opens at most one PR a week.
version: 2
updates:
  # Actions are pinned to commit SHAs; Dependabot bumps the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  # Python dependencies in pyproject.toml / uv.lock
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }

  # Dev container features (devcontainer.json / devcontainer-lock.json)
  - package-ecosystem: devcontainers
    directory: /
    schedule: { interval: weekly }
